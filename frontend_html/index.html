<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryWeaver — Children's Story Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="app-container">
        <header class="site-header">
            <div class="header-inner">
                <div class="brand">
                    <svg class="brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    <span class="brand-name">StoryWeaver</span>
                </div>
                <nav class="header-nav">
                    <button class="nav-btn active" id="navCreate">Create</button>
                    <button class="nav-btn" id="navGallery">Library</button>
                </nav>
            </div>
        </header>

        <main class="main-content">
            <div id="createView">
            <div class="page-intro">
                <h2>Create a Story</h2>
                <p class="section-subtitle">Choose a character, pick a moral lesson, and we'll craft a unique tale.</p>
            </div>

            <form class="story-form" id="storyForm">
                <div class="form-section">
                    <label class="form-label">Age Group</label>
                    <div class="age-options">
                        <button type="button" class="age-btn" data-value="4">
                            <svg class="age-icon" width="56" height="56" viewBox="0 0 64 64" fill="none">
                                <circle cx="32" cy="36" r="20" fill="#FFE4B5"/>
                                <circle cx="22" cy="28" r="8" fill="#FFE4B5"/>
                                <circle cx="42" cy="28" r="8" fill="#FFE4B5"/>
                                <circle cx="22" cy="28" r="4" fill="#FFB6C1"/>
                                <circle cx="42" cy="28" r="4" fill="#FFB6C1"/>
                                <circle cx="26" cy="34" r="3" fill="#2D3A2E"/>
                                <circle cx="38" cy="34" r="3" fill="#2D3A2E"/>
                                <circle cx="27" cy="33" r="1" fill="white"/>
                                <circle cx="39" cy="33" r="1" fill="white"/>
                                <ellipse cx="32" cy="40" rx="4" ry="3" fill="#FFB6C1"/>
                                <path d="M28 44 Q32 48 36 44" stroke="#2D3A2E" stroke-width="2" stroke-linecap="round"/>
                                <circle cx="18" cy="40" r="3" fill="#FFB6C1" opacity="0.5"/>
                                <circle cx="46" cy="40" r="3" fill="#FFB6C1" opacity="0.5"/>
                            </svg>
                            <span class="age-label">4–5 years</span>
                        </button>
                        <button type="button" class="age-btn selected" data-value="5-6">
                            <svg class="age-icon" width="56" height="56" viewBox="0 0 64 64" fill="none">
                                <circle cx="32" cy="36" r="20" fill="#B5EAD7"/>
                                <circle cx="22" cy="28" r="8" fill="#B5EAD7"/>
                                <circle cx="42" cy="28" r="8" fill="#B5EAD7"/>
                                <circle cx="22" cy="28" r="4" fill="#FFDAC1"/>
                                <circle cx="42" cy="28" r="4" fill="#FFDAC1"/>
                                <circle cx="26" cy="34" r="3" fill="#2D3A2E"/>
                                <circle cx="38" cy="34" r="3" fill="#2D3A2E"/>
                                <circle cx="27" cy="33" r="1" fill="white"/>
                                <circle cx="39" cy="33" r="1" fill="white"/>
                                <ellipse cx="32" cy="40" rx="4" ry="3" fill="#FFDAC1"/>
                                <path d="M28 44 Q32 48 36 44" stroke="#2D3A2E" stroke-width="2" stroke-linecap="round"/>
                                <circle cx="18" cy="40" r="3" fill="#FFDAC1" opacity="0.5"/>
                                <circle cx="46" cy="40" r="3" fill="#FFDAC1" opacity="0.5"/>
                                <path d="M14 20 Q18 12 22 18" stroke="#4A7C59" stroke-width="2" stroke-linecap="round"/>

                            </svg>
                            <span class="age-label">5–6 years</span>
                        </button>
                        <button type="button" class="age-btn" data-value="7-8">
                            <svg class="age-icon" width="56" height="56" viewBox="0 0 64 64" fill="none">
                                <circle cx="32" cy="36" r="20" fill="#C7CEEA"/>
                                <circle cx="22" cy="28" r="8" fill="#C7CEEA"/>
                                <circle cx="42" cy="28" r="8" fill="#C7CEEA"/>
                                <circle cx="22" cy="28" r="4" fill="#FFD1DC"/>
                                <circle cx="42" cy="28" r="4" fill="#FFD1DC"/>
                                <circle cx="26" cy="34" r="3" fill="#2D3A2E"/>
                                <circle cx="38" cy="34" r="3" fill="#2D3A2E"/>
                                <circle cx="27" cy="33" r="1" fill="white"/>
                                <circle cx="39" cy="33" r="1" fill="white"/>
                                <ellipse cx="32" cy="40" rx="4" ry="3" fill="#FFD1DC"/>
                                <path d="M28 44 Q32 48 36 44" stroke="#2D3A2E" stroke-width="2" stroke-linecap="round"/>
                                <circle cx="18" cy="40" r="3" fill="#FFD1DC" opacity="0.5"/>
                                <circle cx="46" cy="40" r="3" fill="#FFD1DC" opacity="0.5"/>
                                <path d="M20 16 L24 20 L20 24" stroke="#4A7C59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M44 16 L40 20 L44 24" stroke="#4A7C59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

                </div>

                <div class="form-section">

                            Custom
                        </button>
                    </div>

                                <circle cx="28" cy="28" r="4" fill="#FFB6C1"/>
                                <circle cx="36" cy="36" r="4" fill="#B5EAD7"/>
                                <path d="M24 44 Q32 50 40 44" stroke="#4A7C59" stroke-width="2" stroke-linecap="round"/>

                            <span class="moral-label">Honesty</span>
                        </button>
                        <button type="button" class="moral-card" data-value="sharing is caring">

                        </button>
                        <button type="button" class="moral-card" data-value="kindness">

                                <path d="M32 44 C24 36 20 30 20 25 C20 21 22 18 26 18 C29 18 32 21 32 21 C32 21 35 18 38 18 C42 18 44 21 44 25 C44 30 40 36 32 44Z" fill="#FFB6C1"/>
                                <circle cx="26" cy="24" r="2" fill="white" opacity="0.6"/>
                                <path d="M44 12 L46 16 L50 16 L47 19 L48 23 L44 21 L40 23 L41 19 L38 16 L42 16 Z" fill="#FFD700"/>
                            </svg>
                            <span class="moral-label">Kindness</span>
                        </button>
                        <button type="button" class="moral-card" data-value="courage">

                                <circle cx="32" cy="32" r="24" fill="#E8F4FD"/>
                                <path d="M32 12 L44 18 L44 32 Q44 44 32 52 Q20 44 20 32 L20 18 Z" fill="#4A90D9"/>
                                <path d="M32 16 L40 20 L40 32 Q40 40 32 46 Q24 40 24 32 L24 20 Z" fill="#87CEEB"/>

                            <span class="moral-label">Courage</span>
                        </button>

                                <circle cx="32" cy="32" r="24" fill="#F0E6FF"/>
                                <circle cx="32" cy="24" r="8" fill="#FFDAC1"/>
                                <path d="M20 44 Q20 34 32 34 Q44 34 44 44" fill="#C7CEEA"/>
                                <circle cx="29" cy="22" r="1.5" fill="#2D3A2E"/>
                                <circle cx="35" cy="22" r="1.5" fill="#2D3A2E"/>
                                <path d="M29 27 Q32 29 35 27" stroke="#2D3A2E" stroke-width="1.5" stroke-linecap="round"/>
                                <path d="M16 20 Q16 16 20 16" stroke="#B19CD9" stroke-width="2" stroke-linecap="round"/>
                                <path d="M48 20 Q48 16 44 16" stroke="#B19CD9" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                            <span class="moral-label">Respect</span>
                        </button>
                        <button type="button" class="moral-card" data-value="fairness">

                                <circle cx="32" cy="32" r="24" fill="#FFF8E7"/>

                                <circle cx="32" cy="48" r="4" fill="#4A7C59"/>
                            </svg>
                            <span class="moral-label">Fairness</span>
                        </button>
                    </div>
                    <div class="custom-moral-input" id="customMoralInput" style="display: none;">
                        <input type="text" class="moral-text-input" id="moralCustom" placeholder="Enter your own moral lesson..." />
                    </div>
                </div>

                <div class="form-section">
                    <label class="form-label">Main Character</label>
                    <div class="character-grid">
                        <label class="character-btn">
                            <input type="radio" name="character" value="animal" checked>

                                    <path d="M23 24 Q23 16 32 10 Q41 16 41 24" fill="#B19CD9"/>
                                    <circle cx="29" cy="27" r="1.5" fill="#2D3A2E"/>
                                    <circle cx="35" cy="27" r="1.5" fill="#2D3A2E"/>
                                    <path d="M29 30 Q32 32 35 30" stroke="#2D3A2E" stroke-width="1.5" stroke-linecap="round"/>
                                    <path d="M22 50 Q22 34 32 34 Q42 34 42 50" fill="#B19CD9"/>
                                    <path d="M26 42 Q32 46 38 42" fill="#C7CEEA"/>
                                    <circle cx="32" cy="38" r="2" fill="#FFD700"/>
                                </svg>
                                <span class="char-label">Wizard</span>
                            </span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="generate-btn" id="generateBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 3-3 3-3-3 3-3Z"/><path d="M5 8h14v12H5z"/><path d="M12 8v12"/></svg>
                    <span>Generate Story</span>
                </button>
            </form>

            <div class="form-error" id="formError" style="display: none;"></div>
            </div>

            <section class="story-section" id="storyView" style="display: none;">
                <button class="back-btn" id="backBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    <span>Back</span>
                </button>

                <div class="book-widget">
                    <div class="book-left">
                        <div class="book-image-container">
                            <img id="bookImage" src="" alt="Story illustration" />
                        </div>
                        <div class="book-actions">
                            <button class="action-btn" id="pngBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                                Save PNG
                            </button>
                            <button class="action-btn" id="pdfBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                Save PDF
                            </button>
                            <button class="action-btn fav-btn" id="favBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                <span>Save</span>
                            </button>
                        </div>
                    </div>
                    <div class="book-right">
                        <div class="book-header">
                            <h2 id="storyTitle">Story Title</h2>
                            <div class="story-meta">
                                <span id="ageInfo">Age: 5–6 years</span>
                                <span class="meta-divider"></span>
                                <span id="characterInfo">Character: Animal</span>
                                <span class="meta-divider"></span>
                                <span id="moralInfo">Moral: sharing is caring</span>
                            </div>
                        </div>
                        <div class="story-text" id="storyText">
                            <p>Your story will appear here.</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div class="gallery-overlay" id="galleryOverlay">
            <div class="gallery-panel">
                <div class="gallery-panel-header">
                    <h2>Your Library</h2>
                    <button class="close-btn" id="closeGallery">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="gallery-grid" id="galleryPanelGrid"></div>
            </div>
        </div>

        <div class="error-overlay" id="errorOverlay">
            <div class="error-card">
                <h2>Something went wrong</h2>
                <p id="errorMessage">An error occurred</p>
                <button class="retry-btn" id="retryBtn">Try Again</button>
            </div>
        </div>
    </div>

    <script>
        let story = null;
        let favorites = [];
        let selectedAge = '5-6';
        let selectedMoral = '';

        const form = document.getElementById('storyForm');
        const moralCustom = document.getElementById('moralCustom');
        const customToggle = document.getElementById('customToggle');
        const customMoralInput = document.getElementById('customMoralInput');
        const generateBtn = document.getElementById('generateBtn');
        const formError = document.getElementById('formError');
        const createView = document.getElementById('createView');
        const storyView = document.getElementById('storyView');
        const storyTitle = document.getElementById('storyTitle');
        const ageInfo = document.getElementById('ageInfo');
        const characterInfo = document.getElementById('characterInfo');
        const moralInfo = document.getElementById('moralInfo');
        const storyText = document.getElementById('storyText');
        const pdfBtn = document.getElementById('pdfBtn');
        const pngBtn = document.getElementById('pngBtn');
        const backBtn = document.getElementById('backBtn');
        const bookImage = document.getElementById('bookImage');
        const favBtn = document.getElementById('favBtn');
        const galleryGrid = document.getElementById('galleryGrid');
        const galleryOverlay = document.getElementById('galleryOverlay');
        const galleryPanelGrid = document.getElementById('galleryPanelGrid');
        const closeGallery = document.getElementById('closeGallery');
        const errorOverlay = document.getElementById('errorOverlay');
        const errorMessage = document.getElementById('errorMessage');
        const retryBtn = document.getElementById('retryBtn');
        const ageBtns = document.querySelectorAll('.age-btn');
        const moralCards = document.querySelectorAll('.moral-card');
        const navCreate = document.getElementById('navCreate');
        const navGallery = document.getElementById('navGallery');

        ageBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                ageBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedAge = btn.dataset.value;
            });
        });

        moralCards.forEach(card => {
            card.addEventListener('click', () => {
                moralCards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedMoral = card.dataset.value;
                moralCustom.value = '';
                customMoralInput.style.display = 'none';
            });
        });

        customToggle.addEventListener('click', () => {
            const isHidden = customMoralInput.style.display === 'none';
            customMoralInput.style.display = isHidden ? 'block' : 'none';
            if (isHidden) {
                moralCustom.focus();
                moralCards.forEach(c => c.classList.remove('selected'));
                selectedMoral = '';
            }
        });

        moralCustom.addEventListener('input', () => {
            if (moralCustom.value.trim()) {
                moralCards.forEach(c => c.classList.remove('selected'));
                selectedMoral = '';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const moral = selectedMoral || moralCustom.value.trim();
            if (!moral) {
                showError('Please select or enter a moral lesson');
                return;
            }

            const character = document.querySelector('input[name="character"]:checked').value;

            setLoading(true);
            hideError();

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        age: selectedAge,
                        moralLesson: moral,
                        character: character,
                    }),
                });

                if (!response.ok) throw new Error('Failed to generate story');

                const data = await response.json();
                story = data.story;
                favorites.push(story);
                saveFavorites();
                displayStory();
                hideError();
            } catch (err) {
                console.error('Generation error:', err);
                showError('Failed to generate story. Please try again.');
            } finally {
                setLoading(false);
            }
        });

        function showCreateView() {
            createView.style.display = 'block';
            storyView.style.display = 'none';
            navCreate.classList.add('active');
            navGallery.classList.remove('active');
        }

        function showStoryView() {
            createView.style.display = 'none';
            storyView.style.display = 'block';
            navGallery.classList.add('active');
            navCreate.classList.remove('active');
        }

        function displayStory() {
            if (!story) return;

            storyTitle.textContent = story.title || 'Untitled Story';

            const ageLabels = { '4': '4–5 years', '5-6': '5–6 years', '7-8': '7–8 years' };
            ageInfo.textContent = `Age: ${ageLabels[story.age] || story.age || 'N/A'}`;
            characterInfo.textContent = `Character: ${story.character ? story.character.charAt(0).toUpperCase() + story.character.slice(1) : 'N/A'}`;
            moralInfo.textContent = `Moral: ${story.moralLesson || 'N/A'}`;

            const paragraphs = (story.storyText || '').split('\n\n').filter(p => p.trim());
            storyText.innerHTML = paragraphs.map(p => `<p>${p}</p>`).join('');

            const images = Array.isArray(story.imageUrls) ? story.imageUrls : [];
            bookImage.src = images[0] || '';
            bookImage.alt = story.title || 'Story illustration';

            updateFavBtn();
            showStoryView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function newStory() {
            story = null;
            form.reset();
            hideError();
            galleryOverlay.classList.remove('active');
            selectedAge = '5-6';
            selectedMoral = '';
            moralCustom.value = '';
            customMoralInput.style.display = 'none';
            ageBtns.forEach(b => b.classList.remove('selected'));
            ageBtns[1].classList.add('selected');
            moralCards.forEach(c => c.classList.remove('selected'));
            showCreateView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        backBtn.addEventListener('click', newStory);

        function updateFavBtn() {
            if (story && story.favorite) {
                favBtn.classList.add('favorited');
                favBtn.querySelector('span').textContent = 'Saved';
            } else {
                favBtn.classList.remove('favorited');
                favBtn.querySelector('span').textContent = 'Save';
            }
        }

        favBtn.addEventListener('click', async () => {
            if (!story) return;

            try {
                const response = await fetch(`/api/favorites/${story.id}`, { method: 'POST' });
                const data = await response.json();
                story = data.story;
                updateFavBtn();

                const index = favorites.findIndex(f => f.id === story.id);
                if (index !== -1) favorites[index] = story;
                saveFavorites();
            } catch (err) {
                console.error('Error toggling favorite:', err);
            }
        });

        function renderGallery() {
            const stored = JSON.parse(localStorage.getItem('storyFavorites') || '[]');
            favorites = stored.length > 0 ? stored : favorites;

            if (favorites.length === 0) {
                const emptyHTML = `
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                        <p>No stories yet</p>
                        <span>Create your first story to see it here.</span>
                    </div>
                `;
                galleryGrid.innerHTML = emptyHTML;
                galleryPanelGrid.innerHTML = emptyHTML;
                return;
            }

            const cardsHTML = favorites.map((fStory) => `
                <div class="gallery-card" data-id="${fStory.id}">
                    <div class="gallery-card-img">
                        <img src="${fStory.imageUrls?.[0] || ''}" alt="${fStory.title}">
                    </div>
                    <div class="gallery-card-info">
                        <h3>${fStory.title}</h3>
                        <span class="gallery-card-moral">${fStory.moralLesson}</span>
                    </div>
                </div>
            `).join('');

            galleryGrid.innerHTML = cardsHTML;
            galleryPanelGrid.innerHTML = cardsHTML;

            document.querySelectorAll('.gallery-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = card.dataset.id;
                    const found = favorites.find(f => f.id === id);
                    if (found) {
                        story = found;
                        displayStory();
                        galleryOverlay.classList.remove('active');
                    }
                });
            });
        }

        function saveFavorites() {
            localStorage.setItem('storyFavorites', JSON.stringify(favorites));
        }

        navCreate.addEventListener('click', () => {
            newStory();
        });

        navGallery.addEventListener('click', () => {
            renderGallery();
            galleryOverlay.classList.add('active');
        });

        closeGallery.addEventListener('click', () => {
            galleryOverlay.classList.remove('active');
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorOverlay.classList.add('active');
        }

        function hideError() {
            errorOverlay.classList.remove('active');
            formError.style.display = 'none';
        }

        retryBtn.addEventListener('click', () => {
            errorOverlay.classList.remove('active');
            if (story) form.dispatchEvent(new Event('submit'));
        });

        function setLoading(loading) {
            if (loading) {
                generateBtn.disabled = true;
                generateBtn.innerHTML = '<span class="spinner"></span><span>Generating...</span>';
            } else {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 3-3 3-3-3 3-3Z"/><path d="M5 8h14v12H5z"/><path d="M12 8v12"/></svg><span>Generate Story</span>';
            }
        }

        pngBtn.addEventListener('click', async () => {
            if (!story) return;
            const url = story.imageUrls?.[0];
            if (!url || url.includes('placeholder')) {
                showError('The illustration is not ready yet. Please generate the story again.');
                return;
            }

            const fileName = (story.title || 'story').replace(/[^\w\-]+/g, '_');

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('fetch failed');
                const blob = await res.blob();
                const objectUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = objectUrl;
                link.download = `${fileName}.png`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(objectUrl);
            } catch (err) {
                const link = document.createElement('a');
                link.href = url;
                link.download = `${fileName}.png`;
                link.click();
            }
        });

        pdfBtn.addEventListener('click', () => {
            if (!story) return;

            const paragraphs = (story.storyText || '').split('\n\n').filter(p => p.trim());
            const images = (story.imageUrls || []).filter(u => u && !u.includes('placeholder'));

            const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>${story.title || 'Story'}</title>
                    <link rel="stylesheet" href="/app.css">
                    <style>
                        body { font-family: 'DM Serif Display', Georgia, serif; max-width: 700px; margin: 0 auto; padding: 40px; color: #2d3a2e; }
                        h1 { font-size: 2rem; margin-bottom: 8px; }
                        .meta { color: #7a8b7c; font-size: 0.85rem; margin-bottom: 28px; font-family: 'Inter', sans-serif; }
                        p { line-height: 1.8; margin-bottom: 1em; text-indent: 30px; }
                        .images { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 32px; }
                        .images img { width: 180px; height: 180px; object-fit: cover; border-radius: 12px; }
                    </style>
                </head>
                <body>
                    <h1>${story.title || 'Story'}</h1>
                    <p class="meta">Age: ${story.age || 'N/A'} &nbsp;|&nbsp; Character: ${story.character || 'N/A'} &nbsp;|&nbsp; Moral: ${story.moralLesson || 'N/A'}</p>
                    ${paragraphs.map(p => `<p>${p}</p>`).join('')}
                    ${images.length ? `<div class="images">${images.map(url => `<img src="${url}" alt="Story illustration" />`).join('')}</div>` : ''}
                </body>
                </html>
            `;

            const printWindow = window.open('', '_blank');
            if (!printWindow) {
                showError('Please allow pop-ups to save this story as PDF.');
                return;
            }

            printWindow.document.write(printContent);
            printWindow.document.close();

            const triggerPrint = () => {
                printWindow.focus();
                printWindow.print();
            };

            const imgs = Array.from(printWindow.document.images);
            let pending = imgs.filter(img => !img.complete).length;

            if (pending === 0) {
                setTimeout(triggerPrint, 300);
            } else {
                let loaded = 0;
                imgs.forEach(img => {
                    const done = () => {
                        loaded++;
                        if (loaded >= pending) setTimeout(triggerPrint, 300);
                    };
                    img.addEventListener('load', done);
                    img.addEventListener('error', done);
                });
            }
        });

        renderGallery();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') galleryOverlay.classList.remove('active');
        });

        galleryOverlay.addEventListener('click', (e) => {
            if (e.target === galleryOverlay) galleryOverlay.classList.remove('active');
        });
    </script>
</body>
</html>
